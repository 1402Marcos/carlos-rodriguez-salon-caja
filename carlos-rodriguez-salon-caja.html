<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CR Salón">
<meta name="theme-color" content="#4A1942">
<title>Carlos Rodríguez Salón — Caja</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234A1942'/%3E%3Ctext x='50' y='68' font-size='56' font-family='Georgia,serif' fill='%23F6EEE0' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{
  --brand:#4A1942; --brand-dark:#331230; --brand-light:#6B2A60;
  --brand-tint:#F3E9F1;
  --accent:#B8894A; --accent-dark:#93692F; --accent-tint:#F6EEE0;
  --ink:#1A1720; --ink-soft:#635C6B; --ink-faint:#9A93A0;
  --paper:#FAFAF9; --paper-dim:#F1EEF0; --card:#FFFFFF;
  --line:#E7E2E6; --line-strong:#D8D2D9;
  --success:#1E8A5C; --success-tint:#E4F5EC; --success-dark:#166B47;
  --danger:#C23B4B; --danger-tint:#FBE9EB; --danger-dark:#9C2E3B;
  --warning:#B8894A; --warning-tint:#F6EEE0;
  --info:#2F6FB8; --info-tint:#E8F1FB;
  --shadow-sm:0 1px 3px rgba(26,23,32,.06), 0 1px 2px rgba(26,23,32,.04);
  --shadow:0 6px 20px rgba(26,23,32,.08);
  --shadow-lg:0 16px 40px rgba(26,23,32,.16);
  --radius-lg:18px; --radius:14px; --radius-sm:10px;
  --font-display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sidebar-w:272px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--paper);}
body{font-family:var(--font-body);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent-tint);}
h1,h2,h3{margin:0;}
svg{display:block;}

.app-shell{min-height:100vh;background:var(--paper);}
.main-col{min-height:100vh;padding-bottom:88px;}
.content{padding:16px 16px 8px; max-width:1080px; margin:0 auto;}
@media (min-width:900px){
  .app-shell{display:flex;}
  .main-col{flex:1;min-width:0;padding-bottom:0;}
  .content{padding:28px 36px 56px;}
  .bottomnav{display:none !important;}
  .sidebar{display:flex !important;}
}

.sidebar{display:none; width:var(--sidebar-w); flex:none; flex-direction:column; background:linear-gradient(180deg,var(--brand) 0%, var(--brand-dark) 100%); color:#F3ECF2; position:sticky; top:0; height:100vh; overflow-y:auto;}
.sb-brand{padding:26px 24px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,.1);}
.sb-brand .mark{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;flex:none;border:1px solid rgba(255,255,255,.18);}
.sb-brand .txt{min-width:0;}
.sb-brand .txt b{display:block;font-family:var(--font-display);font-size:15.5px;line-height:1.25;font-weight:400;}
.sb-brand .txt span{display:block;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;margin-top:2px;}
.sb-nav{flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:2px;}
.sb-nav .sb-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;opacity:.5;padding:14px 12px 6px;}
.sb-link{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; border:none; background:none; color:rgba(255,255,255,.78); font-size:13.8px; font-weight:600; text-align:left; width:100%;}
.sb-link svg{width:19px;height:19px;flex:none;opacity:.85;}
.sb-link:hover{background:rgba(255,255,255,.07);}
.sb-link.active{background:rgba(255,255,255,.16); color:#fff;}
.sb-link.active svg{opacity:1;}
.sb-foot{padding:14px 16px 20px; border-top:1px solid rgba(255,255,255,.1);}
.sb-user{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.sb-user .av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
.sb-user .info{min-width:0;}
.sb-user .info b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;}
.sb-user .info span{font-size:10.5px;opacity:.6;text-transform:capitalize;}
.sb-logout{width:100%;padding:9px;border-radius:9px;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;}
.sb-logout:hover{background:rgba(255,255,255,.16);}
.sb-logout svg{width:15px;height:15px;}

.topbar{background:var(--card); border-bottom:1px solid var(--line); padding:14px 16px; position:sticky; top:0; z-index:15;}
.topbar-row{display:flex;align-items:center;justify-content:space-between; max-width:1080px; margin:0 auto;}
.brand{font-family:var(--font-display);font-size:18px;line-height:1.1;color:var(--ink);}
.brand small{display:block;font-family:var(--font-body);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-soft);margin-top:3px;font-weight:600;}
.top-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--paper-dim);border:none;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:active{background:var(--line);}
.userchip{font-size:11.5px;background:var(--brand-tint);color:var(--brand);padding:5px 12px 5px 9px;border-radius:99px;display:flex;align-items:center;gap:6px;font-weight:700;}
.userchip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
@media (min-width:900px){ .has-sidebar .topbar .brand{display:none;} .has-sidebar .topbar-row{justify-content:flex-end;} }

.section-title{font-family:var(--font-display); font-size:16px; color:var(--ink); margin:24px 0 12px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:400;}
.section-title .link{font-family:var(--font-body);font-size:12px;color:var(--brand);text-decoration:none;font-weight:700;display:flex;align-items:center;gap:3px;}
.page-head{margin-bottom:4px;}
.page-head h1{font-family:var(--font-display);font-size:22px;font-weight:400;color:var(--ink);}
.page-head p{font-size:13px;color:var(--ink-soft);margin-top:3px;}
.muted{color:var(--ink-soft);}
.small{font-size:12.5px;}
.tiny{font-size:11px;}
.pageback{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.pageback .icon-btn{background:none;color:var(--brand);}

.receipt{background:linear-gradient(155deg,var(--brand) 0%, var(--brand-dark) 100%); color:#fff; border-radius:var(--radius-lg); padding:22px 22px 26px; position:relative; box-shadow:var(--shadow-lg); overflow:hidden;}
.receipt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg, rgba(255,255,255,.035) 0 2px, transparent 2px 16px);pointer-events:none;}
.receipt-eyebrow{font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.65); display:flex; justify-content:space-between; position:relative; z-index:1;}
.receipt-balance-row{display:flex;align-items:baseline;gap:10px;position:relative;z-index:1;}
.receipt-balance{font-family:var(--font-display); font-size:38px; margin:6px 0 2px;}
.eye-toggle{background:rgba(255,255,255,.14);border:none;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
.eye-toggle svg{width:15px;height:15px;}
.receipt-dash{border:none; border-top:1px dashed rgba(255,255,255,.28); margin:16px 0; position:relative; z-index:1;}
.receipt-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; position:relative; z-index:1;}
.receipt-grid div b{display:block; font-family:var(--font-mono); font-size:15px; margin-top:3px;}
.receipt-grid .lbl{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,.6);}
.receipt-closing{margin-top:16px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.28);display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;flex-wrap:wrap;}
.closing-badge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;}
.closing-badge svg{width:14px;height:14px;}
.closing-badge.open{color:#FFD9DE;}
.closing-badge.closed{color:#CFF3E1;}
.receipt .mini-btn{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:12px;font-weight:700;padding:8px 14px;border-radius:9px;display:flex;align-items:center;gap:6px;}
.receipt .mini-btn:active{background:rgba(255,255,255,.28);}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-sm); margin-bottom:14px;}
.grid-auto{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
.grid-auto-sm{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px;}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px; box-shadow:var(--shadow-sm);}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.kpi .k-lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:700;}
.kpi .k-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
.kpi .k-ic svg{width:15px;height:15px;}
.kpi .k-val{font-family:var(--font-mono); font-size:20px; font-weight:700;}
.kpi .k-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;}

.quick-actions{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:16px 0;}
.qa-btn{border:none; border-radius:var(--radius); padding:16px; text-align:left; color:#fff; font-weight:700; font-size:14px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm);}
.qa-btn.in{background:linear-gradient(135deg,var(--success) 0%,var(--success-dark) 100%);}
.qa-btn.out{background:linear-gradient(135deg,var(--danger) 0%,var(--danger-dark) 100%);}
.qa-btn.neutral{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);}
.qa-btn .ic{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;}
.qa-btn .ic svg{width:17px;height:17px;}

.mv-row{display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line);}
.mv-row:last-child{border-bottom:none;}
.mv-ic{width:38px;height:38px;border-radius:11px; flex:none; display:flex;align-items:center;justify-content:center;}
.mv-ic svg{width:17px;height:17px;}
.mv-ic.in{background:var(--success-tint); color:var(--success-dark);}
.mv-ic.out{background:var(--danger-tint); color:var(--danger-dark);}
.mv-body{flex:1; min-width:0;}
.mv-title{font-size:13.8px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mv-sub{font-size:11.5px; color:var(--ink-soft); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mv-amt{font-family:var(--font-mono); font-weight:700; font-size:14px; white-space:nowrap; flex:none;}
.mv-amt.in{color:var(--success-dark);}
.mv-amt.out{color:var(--danger-dark);}
.mv-row.tappable{cursor:pointer;}
.mv-row.tappable:hover{background:var(--paper-dim);}

.empty-state{text-align:center; padding:36px 18px; color:var(--ink-soft);}
.empty-state .glyph{width:44px;height:44px;border-radius:50%;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.empty-state .glyph svg{width:20px;height:20px;color:var(--ink-faint);}
.empty-state b{display:block; color:var(--ink); font-family:var(--font-display); font-size:16px; margin-bottom:4px; font-weight:400;}

.rank-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
.rank-row:last-child{border-bottom:none;}
.rank-num{width:24px;height:24px;border-radius:50%;background:var(--accent-tint);color:var(--accent-dark);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
.rank-row:nth-child(1) .rank-num{background:#FCEBC5;color:#8A6516;}
.rank-body{flex:1;min-width:0;}
.rank-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-sub{font-size:11px;color:var(--ink-soft);}
.rank-val{font-family:var(--font-mono);font-weight:700;font-size:13px;flex:none;text-align:right;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; font-weight:700;}
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=date],.field input[type=tel],.field input[type=email],.field select,.field textarea{
  width:100%; padding:12px 12px; border:1.5px solid var(--line); border-radius:var(--radius-sm); background:var(--paper); font-size:15px; color:var(--ink);
}
.field textarea{resize:vertical; min-height:64px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--brand); background:#fff;}
.field .hint{font-size:11px; color:var(--ink-soft); margin-top:5px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.input-affix{position:relative;}
.input-affix.pre input{padding-left:26px;}
.input-affix.suf input{padding-right:30px;}
.input-affix span{position:absolute; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:14px; font-weight:600; pointer-events:none;}
.input-affix.pre span{left:12px;}
.input-affix.suf span{right:12px;}

.pw-wrap{position:relative;}
.pw-wrap input{padding-right:42px;}
.pw-toggle{position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
.pw-toggle:hover{background:var(--paper-dim); color:var(--ink);}
.pw-toggle svg{width:17px;height:17px;}

.segmented{display:flex; background:var(--paper-dim); border-radius:12px; padding:4px; gap:4px;}
.segmented button{flex:1; border:none; background:transparent; padding:10px 8px; border-radius:9px; font-size:13.5px; font-weight:700; color:var(--ink-soft);}
.segmented button.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow-sm);}
.segmented button.active.in{color:var(--success-dark);}
.segmented button.active.out{color:var(--danger-dark);}

.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{border:1.5px solid var(--line); background:var(--card); border-radius:99px; padding:8px 14px; font-size:12.8px; font-weight:700; color:var(--ink-soft);}
.chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}

.btn{border:none; border-radius:var(--radius-sm); padding:13px 18px; font-size:14.5px; font-weight:700; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn svg{width:16px;height:16px;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--brand); color:#fff;}
.btn-primary:active{background:var(--brand-dark);}
.btn-accent{background:var(--accent); color:#fff;}
.btn-secondary{background:var(--paper-dim); color:var(--ink); border:1.5px solid var(--line);}
.btn-ghost{background:transparent; color:var(--brand); padding:10px;}
.btn-danger{background:var(--danger-tint); color:var(--danger-dark);}
.btn-success{background:var(--success-tint); color:var(--success-dark);}
.btn-sm{padding:9px 14px; font-size:12.5px; width:auto;}
.btn[disabled]{opacity:.4; pointer-events:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}
.btn-row .btn{flex:1; min-width:120px;}

.bottomnav{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); display:flex; padding:7px 4px calc(7px + env(safe-area-inset-bottom)); box-shadow:0 -4px 16px rgba(0,0,0,.06); z-index:20;}
.nav-btn{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--ink-faint); font-size:10px; font-weight:700; letter-spacing:.2px;}
.nav-btn svg{width:20px; height:20px;}
.nav-btn.active{color:var(--brand);}

.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px; background:radial-gradient(circle at 20% -10%, var(--brand-light) 0%, var(--brand) 45%, var(--brand-dark) 100%);}
.login-box{width:100%; max-width:380px;}
.login-mark{text-align:center; margin-bottom:28px; color:#fff;}
.login-mark .badge{width:60px;height:60px;border-radius:16px; margin:0 auto 14px; background:rgba(255,255,255,.12); display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-size:26px; border:1px solid rgba(255,255,255,.22);}
.login-mark h1{font-family:var(--font-display); font-size:23px; margin:0; font-weight:400;}
.login-mark p{font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase; opacity:.62; margin-top:6px;}
.login-card{background:var(--paper); border-radius:var(--radius-lg); padding:24px 22px; color:var(--ink); box-shadow:var(--shadow-lg);}
.login-card .field input{background:#fff;}
.login-err{background:var(--danger-tint); color:var(--danger-dark); font-size:12.5px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:14px; display:flex; gap:8px; align-items:flex-start;}
.login-hint{text-align:center; margin-top:18px; font-size:11px; color:rgba(255,255,255,.55);}

.lock-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px; background:linear-gradient(160deg,var(--brand-dark),var(--ink));}
.lock-card{width:100%;max-width:340px;background:var(--paper);border-radius:var(--radius-lg);padding:28px 22px;text-align:center;box-shadow:var(--shadow-lg);}
.lock-ic{width:56px;height:56px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.lock-ic svg{width:26px;height:26px;}

.overlay{position:fixed; inset:0; background:rgba(26,23,32,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:var(--paper); width:100%; max-width:520px; border-radius:20px 20px 0 0; max-height:90vh; overflow-y:auto; padding:6px 20px 28px; animation:sheetup .18s ease-out;}
@keyframes sheetup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@media (min-width:640px){ .overlay{align-items:center;} .sheet{border-radius:var(--radius-lg); max-height:86vh;} }
.sheet-handle{width:38px; height:4px; background:var(--line-strong); border-radius:99px; margin:10px auto 14px;}
@media (min-width:640px){ .sheet-handle{display:none;} }
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.sheet-head h3{font-family:var(--font-display); font-weight:400; font-size:19px; margin:0;}
.sheet-close{background:var(--paper-dim); border:none; width:32px;height:32px; border-radius:50%; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}
.sheet-close svg{width:15px;height:15px;}

.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{border:none; background:var(--paper-dim); color:var(--ink-soft); padding:9px 15px; border-radius:99px; font-size:12.5px; font-weight:700; white-space:nowrap;}
.tab-btn.active{background:var(--brand); color:#fff;}

.menu-item{display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left;}
.menu-item:last-child{border-bottom:none;}
.menu-item:hover{background:var(--paper-dim);}
.menu-item .mi-ic{width:36px;height:36px;border-radius:10px; background:var(--paper-dim); display:flex;align-items:center;justify-content:center; flex:none;}
.menu-item .mi-ic svg{width:16px;height:16px;color:var(--brand);}
.menu-item .mi-txt{flex:1; min-width:0;}
.menu-item .mi-title{font-size:13.8px; font-weight:700;}

/* =====================================================================
   CONSTANTES
===================================================================== */
const DB_NAME='SalonCRDB', DB_VERSION=3;
const SALT='crs_salon_2026_v2';
const PAY_METHODS=['Efectivo','Tarjeta','Transferencia'];
const LOW_STOCK=3;
const DEFAULT_SALON_NAME='Carlos Rodríguez Salón';

const STORES=['users','employees','services','products','expenseCategories','movements','cashClosings','cashOpenings','meta'];

/* =====================================================================
   INDEXEDDB HELPERS
===================================================================== */
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      STORES.forEach(name=>{
        if(!db.objectStoreNames.contains(name)){
          db.createObjectStore(name, name==='meta' ? {keyPath:'key'} : {keyPath:'id', autoIncrement:true});
        }
      });
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function store(db,name,mode){ return db.transaction(name,mode||'readonly').objectStore(name); }
function idbGetAll(db,name){ return new Promise((res,rej)=>{const r=store(db,name).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); }
function idbAdd(db,name,obj){ return new Promise((res,rej)=>{const r=store(db,name,'readwrite').add(obj); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); }
function idbPut(db,name,obj){ return new Promise((res,rej)=>{const r=store(db,name,'readwrite').put(obj); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); }
function idbDel(db,name,id){ return new Promise((res,rej)=>{const r=store(db,name,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);}); }
function idbGet(db,name,id){ return new Promise((res,rej)=>{const r=store(db,name).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); }

/* =====================================================================
   ESTADO GLOBAL
===================================================================== */

  db:null, user:null, view:'dashboard', catTab:'servicios', locked:false,
  employees:[], services:[], products:[], categories:[], movements:[], users:[], closings:[], openings:[],
  meta:{ salonName:DEFAULT_SALON_NAME, backupEmail:'', lockMinutes:DEFAULT_LOCK_MIN, showAmounts:true, logoDataUrl:'' },

   UTILIDADES
===================================================================== */
const $=(sel,root)=>(root||document).querySelector(sel);
const $$=(sel,root)=>[...(root||document).querySelectorAll(sel)];
function fmt(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0); }
function fmtMasked(n){ return S.meta.showAmounts===false ? '••••' : fmt(n); }
function todayISO(){ return toISO(new Date()); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDateLong(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-SV',{weekday:'long', day:'numeric', month:'long'}); }
function fmtDateShort(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-SV',{day:'2-digit', month:'short'}); }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString('es-SV',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('es-SV',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function hashPw(pw){
  try{
    if(window.crypto && window.crypto.subtle){
      const enc=new TextEncoder().encode(pw+SALT);
      const buf=await crypto.subtle.digest('SHA-256',enc);
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=0; const s=pw+SALT;
  for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; }
  return 'fb'+Math.abs(h).toString(16);
}
function toast(msg,type){
  const host=$('#toast-host');
  const t=document.createElement('div');
  t.className='toast';
  if(type==='error'){ t.style.background='#9C2E3B'; }
  if(type==='success'){ t.style.background='#166B47'; }
  t.textContent=msg;
  host.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(()=>t.remove(),260); }, 2400);
}

/* localStorage puede estar bloqueado si el archivo se abre como file:// dentro de un
   visor "en línea" (WhatsApp, gestor de archivos). No debe romper la app: usamos un
   respaldo en memoria. IndexedDB (los datos reales) no se ve afectado por esto. */
const memoryStorage={};
const safeStorage={
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ memoryStorage[k]=v; } },
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return memoryStorage[k]!==undefined?memoryStorage[k]:null; } },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){ delete memoryStorage[k]; } },
};

  S.openings = (await idbGetAll(S.db,'cashOpenings')).sort((a,b)=> b.date.localeCompare(a.date));

}

/* =====================================================================
   AUTENTICACIÓN Y BLOQUEO
===================================================================== */
async function login(username, password){
  const u = S.users.find(x=> x.username.toLowerCase() === username.trim().toLowerCase());
  if(!u || !u.active) return {ok:false, msg:'Usuario no encontrado o inactivo.'};
  const h = await hashPw(password.trim());
  if(h !== u.passwordHash) return {ok:false, msg:'Contraseña incorrecta.'};
  S.user = {id:u.id, username:u.username, name:u.name, role:u.role};
  safeStorage.set('scr_session', String(u.id));
  S.view = u.role==='admin' ? 'dashboard' : 'nuevo';
  S.locked=false;
  touchActivity();
  return {ok:true};
}
function logout(){
  safeStorage.remove('scr_session');
  S.user=null; S.view='dashboard'; S.locked=false;
  render();
}
async function restoreSession(){
  const id = safeStorage.get('scr_session');
  if(!id) return;
  const u = S.users.find(x=>x.id===Number(id));
  if(u && u.active){
    S.user={id:u.id, username:u.username, name:u.name, role:u.role};
    S.view = u.role==='admin' ? 'dashboard' : 'nuevo';
  } else {
    safeStorage.remove('scr_session');
  }
}
function touchActivity(){ lastActivity=Date.now(); }
function setupInactivityLock(){
  ['click','keydown','touchstart','mousemove','scroll'].forEach(ev=>{
    document.addEventListener(ev, ()=>{ if(S.user && !S.locked) touchActivity(); }, {passive:true});
  });
  if(lockTimer) clearInterval(lockTimer);
  lockTimer=setInterval(()=>{
    if(!S.user || S.locked) return;
    const mins = Number(S.meta.lockMinutes)||0;
    if(mins<=0) return;
    if(Date.now()-lastActivity >= mins*60*1000){
      S.locked=true;
      render();
    }
  }, 15000);
}
async function unlock(password){
  const u = S.users.find(x=>x.id===S.user.id);
  const h = await hashPw(password.trim());
  if(h!==u.passwordHash) return false;
  S.locked=false; touchActivity(); render();
  return true;
}

/* =====================================================================
   CÁLCULOS
===================================================================== */
function inRange(dateISO, from, to){ return dateISO>=from && dateISO<=to; }
function rangeFor(key, customFrom, customTo){
  const t=todayISO();
  if(key==='hoy') return {from:t, to:t};
  if(key==='semana'){
    const d=new Date(t+'T00:00:00');
    const day=(d.getDay()+6)%7;
    const mon=new Date(d); mon.setDate(d.getDate()-day);
    return {from: toISO(mon), to:t};
  }
  if(key==='mes') return {from: t.slice(0,8)+'01', to:t};
  return {from: customFrom||t, to: customTo||t};
}
function movementsInRange(from,to){ return S.movements.filter(m=> inRange(m.date, from, to)); }
function totals(list){
  let ingresos=0, egresos=0, comisiones=0, ingServicios=0, ingProductos=0, ingOtros=0;
  const egresosPorCat={};
  list.forEach(m=>{
    if(m.type==='ingreso'){
      ingresos+=m.amount;
      comisiones+= m.commissionAmount||0;
      if(m.itemType==='servicio') ingServicios+=m.amount;
      else if(m.itemType==='producto') ingProductos+=m.amount;
      else ingOtros+=m.amount;
    } else {
      egresos+=m.amount;
      const c=m.category||'Sin categoría';
      egresosPorCat[c]=(egresosPorCat[c]||0)+m.amount;
    }
  });
  return {ingresos, egresos, comisiones, ingServicios, ingProductos, ingOtros, egresosPorCat, balance: ingresos-egresos};
}
function cashByMethod(list){
  const map={};
  PAY_METHODS.forEach(pm=> map[pm]={in:0,out:0});
  list.forEach(m=>{
    const pm = m.paymentMethod || 'Efectivo';
    if(!map[pm]) map[pm]={in:0,out:0};
    if(m.type==='ingreso') map[pm].in+=m.amount; else map[pm].out+=m.amount;
  });
  return map;
}
function topItems(list, itemType, limit){
  const agg={};
  list.forEach(m=>{
    if(m.type==='ingreso' && m.itemType===itemType && m.itemId){
      const key=m.itemId;
      if(!agg[key]) agg[key]={id:key, name:m.concept, count:0, amount:0};
      agg[key].count += (m.qty||1);
      agg[key].amount += m.amount;
      agg[key].name = m.concept || agg[key].name;
    }
  });
  return Object.values(agg).sort((a,b)=>b.amount-a.amount).slice(0, limit||5);
}

function expectedCashFor(dateISO){
  const opening = getOpening(dateISO);
  const openingAmt = opening? opening.openingCash : 0;

  const cash = cashByMethod(dayMovs);
  return openingAmt + cash['Efectivo'].in - cash['Efectivo'].out;
}

function renderSparkline(days, maxv){
  const w=560, h=100, bw=(w/days.length)-10;
  let bars='';
  days.forEach((d,i)=>{
    const x=i*(w/days.length)+5;
    const hin=Math.max(2,(d.in/maxv)*h);
    const hout=Math.max(2,(d.out/maxv)*h);
    bars+=`<rect x="${x}" y="${h-hin}" width="${bw/2-2}" height="${hin}" rx="3" fill="#1E8A5C"/>`;
    bars+=`<rect x="${x+bw/2}" y="${h-hout}" width="${bw/2-2}" height="${hout}" rx="3" fill="#C23B4B"/>`;
  });
  const labels = days.map((d,i)=>`<text x="${i*(w/days.length)+5+bw/4}" y="${h+15}" font-size="9.5" fill="#635C6B" text-anchor="middle">${fmtDateShort(d.iso).split(' ')[0]}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h+20}" style="width:100%;height:auto;">${bars}${labels}</svg>`;
}

  `;
}

function renderDayBars(dayKeys, byDay, maxv){
  const w=600, h=120, bw=(w/dayKeys.length)-8;
  let bars='', labels='';
  dayKeys.forEach((k,i)=>{
    const x=i*(w/dayKeys.length)+4;
    const hin=Math.max(2,(byDay[k].in/maxv)*h);
    const hout=Math.max(2,(byDay[k].out/maxv)*h);
    bars+=`<rect x="${x}" y="${h-hin}" width="${bw/2-1.5}" height="${hin}" rx="3" fill="#1E8A5C"/>`;
    bars+=`<rect x="${x+bw/2}" y="${h-hout}" width="${bw/2-1.5}" height="${hout}" rx="3" fill="#C23B4B"/>`;
    labels+=`<text x="${x+bw/4}" y="${h+14}" font-size="8.5" fill="#635C6B" text-anchor="middle">${fmtDateShort(k).split(' ')[0]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h+20}" style="width:100%;height:auto;">${bars}${labels}</svg>`;
}

function renderCierre(){
  const t=todayISO();

  const cash = cashByMethod(todays);
  const tt = totals(todays);
  const expected = expectedCashFor(t);

  const mergedDates = [...new Set([...S.openings.map(o=>o.date), ...S.closings.map(c=>c.date)])].sort().reverse();

  return `

  <div class="card">
    <div class="section-title" style="margin-top:0;">${icon('drawer')}&nbsp; Apertura · ${fmtDateLong(t)}</div>
    ${todayOpening? `
      <div class="banner success">${icon('check')} Caja abierta por ${esc(todayOpening.openedBy)} con un fondo inicial de <b>&nbsp;${fmt(todayOpening.openingCash)}</b>.</div>
      ${todayOpening.notes? `<div class="small muted" style="margin-bottom:10px;"><b>Notas:</b> ${esc(todayOpening.notes)}</div>`:''}

        <button class="btn btn-secondary" data-edit-apertura="${todayOpening.id}">${icon('edit')} Editar apertura</button>
        <button class="btn btn-danger" data-del="apertura" data-delid="${todayOpening.id}">${icon('trash')} Eliminar</button>
      </div>
    ` : `
      <div class="banner warn">${icon('warn')} Aún no registras el fondo inicial de hoy. El efectivo esperado del cierre partirá de $0.00 hasta que la registres.</div>
      <button class="btn btn-primary" data-open-apertura="1">${icon('drawer')} Registrar apertura de hoy</button>
    `}
  </div>

  <div class="card">
    <div class="section-title" style="margin-top:0;">${icon('cash')}&nbsp; Cierre · ${fmtDateLong(t)}</div>
    ${todayClosing? `
      <div class="banner success">${icon('check')} El cierre de hoy ya fue realizado por ${esc(todayClosing.closedBy)} a las ${new Date(todayClosing.closedAt).toLocaleTimeString('es-SV',{hour:'2-digit',minute:'2-digit'})}.</div>

      </div>
    ` : `
      <div class="grid-auto-sm" style="margin-bottom:14px;">
        <div class="kpi"><div class="k-lbl">Fondo inicial</div><div class="k-val">${fmt(todayOpening?todayOpening.openingCash:0)}</div></div>
        <div class="kpi"><div class="k-lbl">Ingresos efectivo</div><div class="k-val" style="color:var(--success-dark)">${fmt(cash['Efectivo'].in)}</div></div>
        <div class="kpi"><div class="k-lbl">Egresos efectivo</div><div class="k-val" style="color:var(--danger-dark)">${fmt(cash['Efectivo'].out)}</div></div>
        <div class="kpi"><div class="k-lbl">Efectivo esperado</div><div class="k-val">${fmt(expected)}</div></div>
      </div>
      <button class="btn btn-primary" data-open-cierre="1">${icon('drawer')} Realizar cierre de hoy</button>
    `}
  </div>

  <div class="section-title">Historial de caja</div>

    ${mergedDates.length? mergedDates.map(d=>{
      const o = S.openings.find(x=>x.date===d);

function openSheet(html){
  const wrap=document.createElement('div');
  wrap.className='overlay';
  wrap.id='sheetOverlay';
  wrap.innerHTML=`<div class="sheet">${html}</div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click',(e)=>{ if(e.target===wrap) closeSheet(); });
  bindSheetEvents();
}

  return `<div class="sheet-handle"></div><div class="sheet-head"><h3>${esc(title)}</h3><button class="sheet-close" data-close-sheet>${icon('x')}</button></div>`;
}

function bindMovementFormEvents(){
  const seg=$('#typeSeg');
  if(seg) $$('[data-type]',seg).forEach(b=>b.addEventListener('click',()=>{ S.mvType=b.getAttribute('data-type'); render(); }));
  const chips=$('#subtypeChips');
  if(chips) $$('[data-sub]',chips).forEach(b=>b.addEventListener('click',()=>{ S.mvSubtype=b.getAttribute('data-sub'); render(); }));
  const catSel=$('#categorySelect');
  if(catSel){
    const syncCategorySelect=()=>{
      const wrap=$('#newCatWrap');
      const addOpt = catSel.querySelector('option[value="__nueva__"]');
      if(catSel.value==='__nueva__'){
        if(wrap) wrap.style.display='block';
      } else {
        if(wrap) wrap.style.display='none';
        // Ya hay una categoría existente elegida (manualmente o precargada al editar):
        // quitamos la opción de "agregar nueva" para no dejarla disponible junto a una selección ya hecha.
        if(catSel.value!=='' && addOpt){ addOpt.remove(); }
      }
    };
    catSel.addEventListener('change', syncCategorySelect);
    syncCategorySelect(); // cubre el caso de editar un egreso que ya trae una categoría preseleccionada
  }

  const svcSel=$('#serviceSelect');
  const prodSel=$('#productSelect');
  const empSel=$('#employeeSelect');
  const commInput = document.querySelector('input[name="commissionPercent"]');
  const amountInput=$('#amountInput');
  const conceptFinal=$('#conceptFinal');
  const commDisplay=$('#commAmountDisplay');
  const qtyInput = document.querySelector('input[name="qty"]');

  function recalcCommission(){
    if(!commInput || !amountInput) return;
    const amt=Number(amountInput.value)||0;
    const pct=Number(commInput.value)||0;
    if(commDisplay) commDisplay.value = (amt*pct/100).toFixed(2);
  }
  function applyServicePrice(){
    if(!svcSel || !svcSel.value) return;
    const opt=svcSel.selectedOptions[0];
    const price=Number(opt.getAttribute('data-price'))||0;
    if(amountInput) amountInput.value=price;
    if(conceptFinal) conceptFinal.value=opt.textContent.split(' — ')[0];
    recalcCommission();
  }
  function applyProductPrice(){
    if(!prodSel || !prodSel.value) return;
    const opt=prodSel.selectedOptions[0];
    const price=Number(opt.getAttribute('data-price'))||0;
    const qty=Number(qtyInput && qtyInput.value)||1;
    if(amountInput) amountInput.value = (price*qty).toFixed(2);
    if(conceptFinal) conceptFinal.value=opt.textContent.split(' — ')[0];
    recalcCommission();
  }
  function applyEmployeeCommission(){
    if(!empSel || !empSel.value || !commInput) return;
    const opt=empSel.selectedOptions[0];
    commInput.value = opt.getAttribute('data-comm');
    recalcCommission();
  }

  if(svcSel) svcSel.addEventListener('change', applyServicePrice);
  if(prodSel) prodSel.addEventListener('change', applyProductPrice);
  if(qtyInput) qtyInput.addEventListener('input', applyProductPrice);
  if(empSel) empSel.addEventListener('change', applyEmployeeCommission);
  if(commInput) commInput.addEventListener('input', recalcCommission);
  if(amountInput) amountInput.addEventListener('input', recalcCommission);

  const cancelBtn=$('#cancelEdit');
  if(cancelBtn) cancelBtn.addEventListener('click',()=>{ S.editingMovement=null; render(); });

  const form=$('#mvForm');
  if(form) form.addEventListener('submit', async (e)=>{ e.preventDefault(); await saveMovement(new FormData(form)); });
}

/* =====================================================================
   GUARDAR MOVIMIENTO
===================================================================== */
async function saveMovement(fd){
  const type=S.mvType;
  const editing=S.editingMovement;
  let payload = {
    type, date: fd.get('date') || todayISO(), paymentMethod: fd.get('paymentMethod') || 'Efectivo',
    createdBy: S.user.username, createdAt: editing? editing.createdAt : new Date().toISOString(),
  };

  if(type==='ingreso'){
    const subtype=S.mvSubtype;
    payload.itemType = subtype==='otro' ? null : subtype;

    if(subtype==='otro'){
      payload.concept = fd.get('conceptOtro') || 'Ingreso';
      payload.amount = Number(fd.get('amount'))||0;
      payload.commissionPercent=0; payload.commissionAmount=0;
    } else {
      const itemId = Number(fd.get('itemId'));
      if(!itemId){ toast('Selecciona un '+subtype,'error'); return; }
      const list = subtype==='servicio'? S.services : S.products;
      const item = list.find(x=>x.id===itemId);
      if(!item){ toast('El elemento seleccionado no existe','error'); return; }
      payload.itemId=itemId; payload.itemType=subtype;
      payload.amount = Number(fd.get('amount'))||0;
      payload.concept = fd.get('conceptFinal') || item.name;
      const empId = Number(fd.get('employeeId'))||null;
      payload.employeeId = empId||null;
      payload.employeeName = empId? (S.employees.find(e=>e.id===empId)||{}).name : null;
      payload.commissionPercent = Number(fd.get('commissionPercent'))||0;
      payload.commissionAmount = payload.amount * payload.commissionPercent/100;
      if(subtype==='producto'){
        const qty = Number(fd.get('qty'))||1;
        payload.qty=qty;
        const prevQty = editing && editing.itemType==='producto' ? (editing.qty||1) : 0;
        const prevItemId = editing ? editing.itemId : null;
        if(editing && prevItemId===itemId){
          item.stock = Math.max(0, item.stock - (qty - prevQty));
        } else {
          if(editing && prevItemId){
            const prevItem=S.products.find(p=>p.id===prevItemId);
            if(prevItem){ prevItem.stock += prevQty; await idbPut(S.db,'products',prevItem); }
          }
          item.stock = Math.max(0, item.stock - qty);
        }
        await idbPut(S.db,'products',item);
      } else if(editing && editing.itemType==='producto' && editing.itemId){
        const prevItem=S.products.find(p=>p.id===editing.itemId);
        if(prevItem){ prevItem.stock += (editing.qty||1); await idbPut(S.db,'products',prevItem); }
      }
    }
  } else {
    let category = fd.get('category');
    const newCatInput = $('#newCatInput');
    if((category==='__nueva__' || !S.categories.length) && newCatInput && newCatInput.value.trim()){
      const name=newCatInput.value.trim();
      let existing = S.categories.find(c=>c.name.toLowerCase()===name.toLowerCase());
      if(!existing){ const id = await idbAdd(S.db,'expenseCategories',{name}); existing={id,name}; }
      category=existing.name;
      S.categories = await idbGetAll(S.db,'expenseCategories');
    }
    if(!category || category==='__nueva__'){ toast('Selecciona o crea una categoría de gasto','error'); return; }
    payload.category=category;
    payload.concept = fd.get('conceptFinal') || category;
    payload.amount = Number(fd.get('amount'))||0;
  }

  if(!payload.amount || payload.amount<=0){ toast('Ingresa un monto válido','error'); return; }

  if(editing){
    payload.id=editing.id;
    await idbPut(S.db,'movements',payload);
    toast('Movimiento actualizado','success');
    S.editingMovement=null;
  } else {
    await idbAdd(S.db,'movements',payload);
    toast('Movimiento guardado','success');
  }
  await loadAll();
  closeSheet();
  render();
}

/* =====================================================================
   BINDINGS DE SHEETS + CASCADA EN TIEMPO REAL
===================================================================== */
async function cascadeRename(kind, id, oldName, newName){
  if(oldName===newName) return;
  if(kind==='empleado'){
    const affected = S.movements.filter(m=>m.employeeId===id);
    for(const m of affected){ m.employeeName=newName; await idbPut(S.db,'movements',m); }
  } else if(kind==='categoria'){
    const affected = S.movements.filter(m=>m.category===oldName);
    for(const m of affected){ m.category=newName; await idbPut(S.db,'movements',m); }
  }
}

function bindPasswordToggles(root){
  $$('.pw-toggle', root).forEach(btn=>btn.addEventListener('click',()=>{
    const input = btn.previousElementSibling;
    if(!input) return;
    if(input.type==='password'){ input.type='text'; btn.innerHTML=icon('eyeoff'); btn.setAttribute('aria-label','Ocultar contraseña'); }
    else { input.type='password'; btn.innerHTML=icon('eye'); btn.setAttribute('aria-label','Mostrar contraseña'); }
  }));
}

function bindDeleteButtons(root){
  $$('[data-del]', root).forEach(b=>b.addEventListener('click', async ()=>{
    const kind=b.getAttribute('data-del');
    const id=Number(b.getAttribute('data-delid'));

    if(kind==='cierre'){
      if(!confirm('¿Eliminar este cierre de caja? Esta acción no se puede deshacer.')) return;
      await idbDel(S.db,'cashClosings',id);
      await loadAll(); closeSheet(); render(); toast('Cierre eliminado','success');
      return;
    }
    if(kind==='apertura'){
      if(!confirm('¿Eliminar esta apertura de caja? Esta acción no se puede deshacer.')) return;
      await idbDel(S.db,'cashOpenings',id);
      await loadAll(); closeSheet(); render(); toast('Apertura eliminada','success');
      return;
    }
    if(kind==='usuario'){
      const u = S.users.find(x=>x.id===id);
      if(!u){ toast('Ese usuario ya no existe','error'); return; }
      if(u.id===S.user.id){ toast('No puedes eliminar tu propia cuenta mientras tienes la sesión iniciada.','error'); return; }
      if(u.role==='admin' && u.active!==false){
        const otherAdmins = S.users.filter(x=>x.role==='admin' && x.id!==u.id && x.active!==false);
        if(otherAdmins.length===0){ toast('Debe existir al menos un administrador activo. No puedes eliminar el último.','error'); return; }
      }
      if(!confirm(`¿Eliminar al usuario "${u.username}"? Esta acción no se puede deshacer.`)) return;
      await idbDel(S.db,'users',id);
      await loadAll(); closeSheet(); render(); toast('Usuario eliminado','success');
      return;
    }

    // servicio / producto / empleado / categoria
    const storeMap = {servicio:'services', producto:'products', empleado:'employees', categoria:'expenseCategories'};
    const storeName = storeMap[kind];
    if(!storeName) return;

    let usedIn=false;
    let usageMsg='No se puede eliminar: tiene movimientos registrados. Márcalo como Inactivo en su lugar para conservar el historial.';
    if(kind==='servicio' || kind==='producto'){
      usedIn = S.movements.some(m=> m.itemType===kind && m.itemId===id);
    } else if(kind==='empleado'){
      usedIn = S.movements.some(m=> m.employeeId===id);
    } else if(kind==='categoria'){
      const cat = S.categories.find(c=>c.id===id);
      usedIn = !!cat && S.movements.some(m=> m.category===cat.name);
      usageMsg = 'No se puede eliminar: hay egresos registrados con esta categoría. Cambia esos egresos a otra categoría antes de eliminarla.';
    }
    if(usedIn){ toast(usageMsg,'error'); return; }

    if(!confirm('¿Eliminar este elemento? Esta acción no se puede deshacer.')) return;
    await idbDel(S.db, storeName, id);
    await loadAll();
    closeSheet(); render();
    toast('Elemento eliminado','success');
  }));
}

function bindSheetEvents(){
  $$('[data-close-sheet]').forEach(b=>b.addEventListener('click', closeSheet));
  const phoneInput=$('#empPhone'); if(phoneInput) maskPhone(phoneInput);
  const usernameInput=$('#usernameInput'); if(usernameInput) maskUsername(usernameInput);

  const catForm=$('#catForm');
  if(catForm) catForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const kind=catForm.getAttribute('data-kind');
    const id=catForm.getAttribute('data-id');
    const fd=new FormData(catForm);
    const storeName = kind==='servicio'?'services': kind==='producto'?'products': kind==='empleado'?'employees':'expenseCategories';
    let obj = id? (await idbGet(S.db, storeName, Number(id))) : {};
    const oldName = obj.name;
    if(kind==='servicio'){
      obj.name=fd.get('name').trim(); obj.price=Number(fd.get('price')); obj.commission=Number(fd.get('commission')); obj.active=fd.get('active')==='1';
    } else if(kind==='producto'){
      obj.name=fd.get('name').trim(); obj.price=Number(fd.get('price')); obj.commission=Number(fd.get('commission')); obj.stock=Number(fd.get('stock')); obj.active=fd.get('active')==='1';
    } else if(kind==='empleado'){
      obj.name=fd.get('name').trim(); obj.phone=fd.get('phone')||''; obj.defaultCommission=Number(fd.get('defaultCommission')); obj.active=fd.get('active')==='1';
    } else if(kind==='categoria'){
      obj.name=fd.get('name').trim();
    }
    let newId;
    if(id){ await idbPut(S.db, storeName, obj); newId=Number(id); } else { newId = await idbAdd(S.db, storeName, obj); }
    if(id && oldName && oldName!==obj.name){ await cascadeRename(kind, newId, oldName, obj.name); }
    await loadAll();
    closeSheet();
    render();
    toast('Guardado con éxito · los cambios ya están reflejados en todo el sistema','success');
  });

  bindDeleteButtons($('#sheetOverlay'));
  bindPasswordToggles($('#sheetOverlay'));

  const userForm=$('#userForm');
  if(userForm) userForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const id=userForm.getAttribute('data-id');
    const fd=new FormData(userForm);
    let obj = id? S.users.find(x=>x.id===Number(id)) : {};
    const username=(fd.get('username')||'').trim().toLowerCase();
    if(!username){ toast('El usuario es obligatorio','error'); return; }
    const dup = S.users.find(u=> u.username.toLowerCase()===username && String(u.id)!==id);
    if(dup){ toast('Ese nombre de usuario ya existe','error'); return; }
    const willStayActiveAdmin = fd.get('role')==='admin' && fd.get('active')==='1';
    if(id && obj.role==='admin' && obj.active!==false && !willStayActiveAdmin){
      const otherAdmins = S.users.filter(u=>u.role==='admin' && u.id!==obj.id && u.active!==false);
      if(otherAdmins.length===0){ toast('Debe existir al menos un administrador activo','error'); return; }
    }
    obj.name=fd.get('name').trim(); obj.username=username; obj.role=fd.get('role'); obj.active=fd.get('active')==='1';
    const pw=(fd.get('password')||'').trim();
    if(pw) obj.passwordHash = await hashPw(pw);
    else if(!obj.passwordHash){ toast('Define una contraseña','error'); return; }
    if(id) await idbPut(S.db,'users',obj); else await idbAdd(S.db,'users',obj);
    await loadAll();
    closeSheet(); render();
    toast('Usuario guardado','success');
  });

  const editMvBtn=$('#editMvBtn');
  if(editMvBtn) editMvBtn.addEventListener('click',()=>{
    const id=Number(editMvBtn.getAttribute('data-editmv'));
    const m=S.movements.find(x=>x.id===id);
    S.editingMovement=m; S.mvType=m.type; S.mvSubtype=m.itemType||'otro'; S.view='nuevo';
    closeSheet(); render();
  });
  const delMvBtn=$('#delMvBtn');
  if(delMvBtn) delMvBtn.addEventListener('click', async ()=>{
    if(!confirm('¿Eliminar este movimiento?')) return;
    const id=Number(delMvBtn.getAttribute('data-delmv'));
    const m=S.movements.find(x=>x.id===id);
    if(m && m.itemType==='producto' && m.itemId){
      const p=S.products.find(x=>x.id===m.itemId);
      if(p){ p.stock += (m.qty||1); await idbPut(S.db,'products',p); }
    }
    await idbDel(S.db,'movements',id);
    await loadAll();
    closeSheet(); render();
    toast('Movimiento eliminado','success');
  });

  const aperturaForm=$('#aperturaForm');
  if(aperturaForm) aperturaForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const id=aperturaForm.getAttribute('data-id');
    const date=aperturaForm.getAttribute('data-date');
    const fd=new FormData(aperturaForm);
    const obj = { date, openingCash: Number(fd.get('openingCash'))||0, notes: fd.get('notes')||'', openedBy: S.user.username, openedAt: id? (S.openings.find(o=>o.id===Number(id))||{}).openedAt || new Date().toISOString() : new Date().toISOString() };
    if(id){ obj.id=Number(id); await idbPut(S.db,'cashOpenings',obj); } else { await idbAdd(S.db,'cashOpenings',obj); }
    await loadAll();
    closeSheet(); render();
    toast('Apertura de caja guardada','success');
  });

  const cierreForm=$('#cierreForm');
  if(cierreForm) cierreForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const id=cierreForm.getAttribute('data-id');
    const date=cierreForm.getAttribute('data-date');
    const fd=new FormData(cierreForm);
    const expected = expectedCashFor(date);
    const counted = Number(fd.get('countedCash'))||0;
    const obj = { date, expectedCash:expected, countedCash:counted, difference: counted-expected, notes: fd.get('notes')||'', closedBy: S.user.username, closedAt: id? (S.closings.find(c=>c.id===Number(id))||{}).closedAt || new Date().toISOString() : new Date().toISOString() };
    if(id){ obj.id=Number(id); await idbPut(S.db,'cashClosings',obj); } else { await idbAdd(S.db,'cashClosings',obj); }
    await loadAll();
    closeSheet(); render();
    toast('Cierre de caja guardado','success');
  });
}

/* =====================================================================
   RESPALDO: CIFRADO, DESCARGA, ENVÍO POR CORREO, RESTAURACIÓN
===================================================================== */
function buildBackupPayload(){
  return {
    version:2, exportedAt: new Date().toISOString(),
    meta:S.meta, users:S.users, employees:S.employees, services:S.services, products:S.products,
    expenseCategories:S.categories, movements:S.movements, cashClosings:S.closings, cashOpenings:S.openings,
  };
}
async function deriveAesKey(passphrase, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptText(text, passphrase){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(passphrase, salt);
  const enc = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));
  return JSON.stringify({ encrypted:true, salt:btoa(String.fromCharCode(...salt)), iv:btoa(String.fromCharCode(...iv)), data:btoa(String.fromCharCode(...new Uint8Array(enc))) });
}
async function decryptText(payloadStr, passphrase){
  const obj = JSON.parse(payloadStr);
  const salt = Uint8Array.from(atob(obj.salt), c=>c.charCodeAt(0));
  const iv = Uint8Array.from(atob(obj.iv), c=>c.charCodeAt(0));
  const data = Uint8Array.from(atob(obj.data), c=>c.charCodeAt(0));
  const key = await deriveAesKey(passphrase, salt);
  const dec = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return new TextDecoder().decode(dec);
}
async function getBackupFile(){
  const payload = JSON.stringify(buildBackupPayload(), null, 2);
  const encToggle=$('#encryptToggle');
  const passInput=$('#backupPassphrase');
  let content=payload, suffix='';
  if(encToggle && encToggle.checked){
    const pass=(passInput && passInput.value)||'';
    if(!pass){ toast('Ingresa una contraseña para proteger el respaldo','error'); return null; }
    content = await encryptText(payload, pass);
    suffix='-protegido';
  }
  const filename = `respaldo-salon_${todayISO()}${suffix}.json`;
  return new File([content], filename, {type:'application/json'});
}
async function exportBackup(){
  const file = await getBackupFile();
  if(!file) return;
  downloadBlob(file, file.name);
  toast('Respaldo descargado','success');
}
async function shareBackupByEmail(){
  const file = await getBackupFile();
  if(!file) return;
  const subject = `Respaldo de caja — ${esc(S.meta.salonName||DEFAULT_SALON_NAME)} (${todayISO()})`;
  const body = `Adjunto el respaldo de datos generado el ${todayISO()}.`;

  const supportsFileShare = !!(navigator.canShare && navigator.share && navigator.canShare({files:[file]}));

  if(supportsFileShare){
    try{
      await navigator.share({files:[file], title:subject, text:body});
      toast('Elige tu app de correo para enviarlo','success');
    }catch(err){
      // El usuario cerró/canceló la ventana de compartir: respetamos su decisión y no hacemos nada más.
      if(err && err.name==='AbortError') return;
      // Falló por otra razón real (no cancelación): ofrecemos el plan B explicado.
      openEmailFallbackSheet(file, subject, body);
    }
    return;
  }
  // Este navegador no soporta compartir archivos: explicamos el plan B antes de ejecutarlo.
  openEmailFallbackSheet(file, subject, body);
}

function openEmailFallbackSheet(file, subject, body){
  openSheet(`
    ${sheetHeader('Enviar respaldo por correo')}
    <div class="banner info">${icon('mail')} Tu navegador no puede adjuntar el archivo automáticamente a un correo. Vamos a hacerlo en dos pasos:</div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line);">
      <div class="small" style="margin-bottom:8px;"><b>1.</b> Se descargará el respaldo a tu dispositivo (<code>${esc(file.name)}</code>).</div>
      <div class="small"><b>2.</b> Se abrirá tu app de correo con el asunto ya escrito — solo debes adjuntar manualmente el archivo que se acaba de descargar.</div>
    </div>
    <div class="btn-row" style="margin-top:16px;">
      <button type="button" class="btn btn-secondary" data-close-sheet>Cancelar</button>
      <button type="button" class="btn btn-primary" id="confirmEmailFallback">${icon('mail')} Continuar</button>
    </div>
  `);
  const btn = $('#confirmEmailFallback');
  if(btn) btn.addEventListener('click', ()=>{
    downloadBlob(file, file.name);
    closeSheet();
    toast('Archivo descargado. Abriendo tu correo…','success');
    setTimeout(()=>{
      const email = S.meta.backupEmail || '';
      const mailto = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body+'\n\nAdjunta manualmente el archivo que se acaba de descargar: '+file.name)}`;
      window.location.href = mailto;
    }, 700);
  });
}
async function importBackup(){
  const input=$('#importFile');
  if(!input.files || !input.files[0]){ toast('Selecciona un archivo primero','error'); return; }
  if(!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?')) return;
  try{
    let text = await input.files[0].text();
    let data;
    try{ data = JSON.parse(text); }
    catch(e){ data=null; }
    if(data && data.encrypted){
      const pass = ($('#restorePassphrase')||{}).value || '';
      text = await decryptText(text, pass);
      data = JSON.parse(text);
    } else if(!data){
      const pass = ($('#restorePassphrase')||{}).value || '';
      text = await decryptText(text, pass);
      data = JSON.parse(text);
    }
    for(const s of STORES){
      if(s==='meta') continue;
      const existing = await idbGetAll(S.db,s);
      for(const item of existing) await idbDel(S.db,s,item.id);
    }
    const keyMap={users:'users',employees:'employees',services:'services',products:'products',expenseCategories:'expenseCategories',movements:'movements',cashClosings:'cashClosings',cashOpenings:'cashOpenings'};
    for(const key of Object.keys(keyMap)){
      const items = data[key]||[];
      for(const item of items){ const {id, ...rest} = item; await idbAdd(S.db,keyMap[key],{...rest}); }
    }
    if(data.meta){ for(const k of Object.keys(data.meta)){ await idbPut(S.db,'meta',{key:k, value:data.meta[k]}); } }
    await loadAll();
    toast('Respaldo restaurado con éxito','success');
    S.view='dashboard'; render();
  }catch(err){
    toast('El archivo no es válido o la contraseña es incorrecta','error');
  }
}
